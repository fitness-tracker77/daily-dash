<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Daily Dash</title>
  <meta name="description" content="Personal daily dashboard: meals, training, pantry and log.">

  <!-- installable on iPhone -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Daily Dash">
  <meta name="theme-color" content="#1B1C1F">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">

  <!-- fonts (system fallback when offline) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">

  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/app.js"></script>
</head>
<body class="booting">
  <main id="main" class="app">
    <div class="boot" aria-live="polite"><span class="boot__mark">S</span><span class="boot__text">Loading</span></div>
  </main>
  <nav id="tabbar" class="tabbar" aria-label="Sections"></nav>
  <noscript><p class="noscript">This app needs JavaScript turned on.</p></noscript>
</body>
</html>
