<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Daily Dash</title>
  <meta name="description" content="Personal training and nutrition dashboard. Everything stays on this device.">
  <meta name="referrer" content="no-referrer">

  <!-- installable on iPhone -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Daily Dash">
  <meta name="theme-color" content="#0C0B09">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">

  <!-- fonts are self-hosted: no request leaves this site -->
  <link rel="preload" href="fonts/cormorant-garamond-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/hanken-grotesk-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/app.js"></script>
</head>
<body class="booting">
  <main id="main" class="app">
    <div class="boot" aria-live="polite"><span class="boot__mark">S</span><span>Loading</span></div>
  </main>
  <nav id="tabbar" class="tabbar" aria-label="Sections"></nav>
  <noscript><p class="noscript">This app needs JavaScript turned on.</p></noscript>
</body>
</html>
